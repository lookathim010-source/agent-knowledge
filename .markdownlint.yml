# markdownlint-cli2 config. Kept lenient where GitHub renders fine.
default: true
MD013: false          # line length — tables and URLs make this noise
MD033:                # inline HTML: allow the few tags GitHub renders
  allowed_elements: [br, details, summary, img, sub, sup]
MD041: false          # first line need not be an H1 (badges, templates)
MD024:
  siblings_only: true # duplicate headings allowed in different sections
